[project]
name = "backlog-tamer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "google-adk>=2.0.0a3",
    "langsmith[google-adk]>=0.7.36",
    "litellm>=1.83.12",
    "openai>=2.24.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "pypdf>=6.10.2",
    "sqlalchemy[asyncio]>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_tamer"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "ruff>=0.15.11",
]
