<circle cx="22" cy="21" r="5.5" fill="#30363d"/><circle cx="40" cy="21" r="5.5" fill="#30363d"/><circle cx="58" cy="21" r="5.5" fill="#30363d"/>
<text x="80" y="25" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="12" fill="#9198a1">intake · telegram → notion</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="14.5" fill="#c9d1d9">
<g class="l a0">
  <text x="28" y="86" xml:space="preserve"><tspan fill="#3fb950">you ›</tspan><tspan> https://github.com/google/adk-python  </tspan><tspan fill="#9198a1">try this for the triage agent</tspan></text>
</g>
<g class="l a2">
  <text x="28" y="138" xml:space="preserve"><tspan fill="#d2a8ff">read  </tspan><tspan>  github.com · repository page               </tspan><tspan fill="#3fb950">ok</tspan></text>
</g>
<g class="l a3">
