<svg xmlns="http://www.w3.org/2000/svg" width="840" height="352" viewBox="0 0 840 352" role="img" aria-label="Terminal recording of one intake: you send a GitHub link with a note, the bot reads the page, drafts 'ADK for Python' (repository, build, High) with two tasks, waits for review, and after approval saves one project and two tasks to Notion.">
<title>Terminal recording of one intake: you send a GitHub link with a note, the bot reads the page, drafts 'ADK for Python' (repository, build, High) with two tasks, waits for review, and after approval saves one project and two tasks to Notion.</title>
