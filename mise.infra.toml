[tools]
terraform = "1.14.5"

[tasks."infra:fmt"]
description = "Check Terraform formatting"
dir = "infra/terraform"
run = "terraform fmt -check"

[tasks."infra:validate"]
description = "Initialize providers and validate Terraform locally"
dir = "infra/terraform"
env = { TF_DATA_DIR = ".terraform/mise-validate" }
run = [
  "terraform init -backend=false -input=false -lockfile=readonly",
  "terraform validate",
]
