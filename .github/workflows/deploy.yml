name: Deploy

# Deploys a released version to production.
#
# Invoked as a reusable workflow by release.yml when release-please cuts a tag,
# or manually via workflow_dispatch to roll back to any previously released
# version. Rollback is fast because the image already exists in ECR: the build
# is skipped and only `terraform apply` runs.
on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to deploy, e.g. v0.2.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy, e.g. v0.1.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    # Native arm64 runner so the Lambda image builds without QEMU emulation.
    runs-on: ubuntu-24.04-arm
    environment: production

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      VERSION: ${{ inputs.version }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: backlog-tamer/terraform.tfstate

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backlog-tamer-deploy

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.5"
          terraform_wrapper: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize Terraform
        run: |
          terraform -chdir=infra/terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Resolve ECR repository
        run: |
          ecr_url="$(terraform -chdir=infra/terraform output -raw ecr_repository_url)"
          {
            echo "ECR_REPOSITORY_URL=$ecr_url"
            echo "ECR_REPOSITORY_NAME=${ecr_url##*/}"
            echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
          } >> "$GITHUB_ENV"

      - name: Log in to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # A rollback targets a version whose image is already in ECR. Detecting
      # that lets us skip the build entirely and go straight to apply.
      - name: Check whether the release image already exists
        id: image
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $VERSION already present in ECR; skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $VERSION not found in ECR; building."
          fi

      - name: Build and push image
        if: steps.image.outputs.exists == 'false'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag "$ECR_REPOSITORY_URL:$VERSION" \
            --tag "$ECR_REPOSITORY_URL:sha-$GITHUB_SHA" \
            --provenance=false \
            --sbom=false \
            --push \
            .

      - name: Apply Terraform
        run: |
          terraform -chdir=infra/terraform apply -input=false -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=${VERSION}"

      - name: Resolve Lambda function names
        run: |
          echo "WEBHOOK_FUNCTION=$(terraform -chdir=infra/terraform output -raw webhook_function_name)" >> "$GITHUB_ENV"
          echo "WORKER_FUNCTION=$(terraform -chdir=infra/terraform output -raw worker_function_name)" >> "$GITHUB_ENV"

      # Verifies the deploy actually took: the worker imports every module it
      # needs (including the optional-dependency paths that fail silently at
      # runtime) and reports the version it is running.
      - name: Smoke test worker
        run: |
          expected="${VERSION#v}"
          error="$(aws lambda invoke \
            --function-name "$WORKER_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 300 \
            --payload '{"healthcheck": true}' \
            --query 'FunctionError' \
            --output text \
            worker-health.json)"

          echo "Worker response: $(cat worker-health.json)"

          if [ "$error" != "None" ]; then
            echo "::error::Worker healthcheck raised $error"
            exit 1
          fi

          actual="$(jq -r '.version // empty' worker-health.json)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Deployed worker reports version '$actual', expected '$expected'"
            exit 1
          fi
          echo "Worker is healthy and running $actual."

      # The webhook Lambda sits behind an unauthenticated Function URL, so the
      # shared secret is its only protection. An unsigned request must be
      # rejected with 403 — a 200 here means TELEGRAM__WEBHOOK_SECRET is unset
      # and the endpoint is open to anyone.
      - name: Smoke test webhook
        run: |
          error="$(aws lambda invoke \
            --function-name "$WEBHOOK_FUNCTION" \
            --cli-binary-format raw-in-base64-out \
            --cli-read-timeout 300 \
            --payload '{"body": "{}", "headers": {}}' \
            --query 'FunctionError' \
            --output text \
            webhook-health.json)"

          echo "Webhook response: $(cat webhook-health.json)"

          if [ "$error" != "None" ]; then
            echo "::error::Webhook smoke test raised $error"
            exit 1
          fi

          status="$(jq -r '.statusCode // empty' webhook-health.json)"
          if [ "$status" != "403" ]; then
            echo "::error::Unsigned webhook request returned $status, expected 403." \
              "If this is 200, TELEGRAM__WEBHOOK_SECRET is not set in Secrets Manager" \
              "and the public Function URL is unauthenticated."
            exit 1
          fi
          echo "Webhook rejects unsigned requests."

      - name: Summary
        run: |
          {
            echo "### Deployed \`$VERSION\` to production"
            echo
            echo "- Image: \`$ECR_REPOSITORY_URL:$VERSION\`"
            echo "- Built this run: \`${{ steps.image.outputs.exists == 'false' }}\`"
            echo "- Smoke tests: worker healthcheck + webhook auth rejection passed"
          } >> "$GITHUB_STEP_SUMMARY"
